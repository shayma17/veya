<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ece5d6" />
<title>Veya — Considered spending</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#ece5d6; --bg2:#e4dcc9;
  --card:#f8f4ea; --card2:#f1ebdd;
  --ink:#2a2418; --ink2:#48402f;
  --stone:#6f6656; --stone2:#8a8072;
  --hair:#d7ceba; --champagne:#a98545;
  --green:#2f8f57; --amber:#db8a2b; --red:#cf463b;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',system-ui,-apple-system,sans-serif;
  --dark:#1a1712;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:var(--sans);font-weight:300;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
#app{max-width:430px;margin:0 auto;padding:22px 18px 56px;min-height:100vh;position:relative}
.lbl{font-family:var(--sans);font-weight:400;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--stone)}

.searchicon{position:absolute;top:22px;right:16px;width:42px;height:42px;border:1.5px solid var(--ink);border-radius:50%;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;z-index:5}
.searchicon:hover{background:var(--ink)}
.searchicon:hover svg{stroke:var(--bg)}

.mast{text-align:center;margin:8px 0 24px}
.mark{font-family:var(--serif);font-weight:500;font-size:40px;letter-spacing:.36em;text-indent:.36em;color:var(--ink)}
.mast .rule{width:34px;height:1px;background:var(--champagne);margin:11px auto 10px}
.mast .sub{font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--stone)}

.scan-btn{width:100%;background:#8ba6b8;color:#ffffff;cursor:pointer;border:none;border-radius:8px;padding:34px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:0 16px 34px -16px rgba(139,166,184,.6);transition:transform .1s,box-shadow .2s,background .2s}
.scan-btn:hover{background:#9bb3c4;transform:translateY(-2px);box-shadow:0 22px 46px -16px rgba(139,166,184,.7)}
.scan-btn:active{transform:scale(.99)}
.barcode{display:flex;align-items:flex-end;gap:3px;height:44px}
.barcode i{display:block;width:2.5px;background:#ffffff;opacity:.97}
.scan-btn .t{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#ffffff}
.scan-btn .cap{font-family:var(--sans);font-weight:500;font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:#e4ecf1;margin-top:-8px}

.snap-btn{width:100%;margin-top:12px;background:transparent;color:var(--ink);cursor:pointer;border:1.5px solid var(--ink);border-radius:5px;padding:17px;font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.24em;text-transform:uppercase;transition:background .2s,color .2s}
.snap-btn:hover{background:var(--ink);color:var(--bg)}
.snap-hint{text-align:center;margin-top:9px;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--stone)}
.valueline{text-align:center;margin-top:30px;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.6;color:var(--ink2)}
.socials-label{text-align:center;margin-top:34px;font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--stone)}
.socials{display:flex;justify-content:center;gap:42px;margin-top:16px}
.social{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;transition:transform .12s}
.social:hover{transform:translateY(-2px)}
.slogo{display:flex;align-items:center;justify-content:center}
.shandle{font-family:var(--sans);font-weight:500;font-size:12.5px;letter-spacing:.02em;color:var(--ink)}

.field-label{display:block;font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--stone);margin:0 0 9px 1px}
.tin{width:100%;background:var(--card);border:1.5px solid var(--hair);color:var(--ink);border-radius:4px;padding:14px 15px;font-family:var(--serif);font-size:19px;outline:none;transition:border-color .2s}
.tin::placeholder{color:#9a907c;font-style:italic}
.tin:focus{border-color:var(--champagne)}
.price-wrap{position:relative;margin-top:14px}
.price-wrap .cur{position:absolute;left:15px;bottom:14px;font-family:var(--serif);font-size:19px;color:var(--stone);pointer-events:none}
.price-wrap .tin{padding-left:30px}

.appraise{width:100%;margin-top:18px;cursor:pointer;background:var(--ink);color:var(--bg);border:none;border-radius:5px;padding:16px;font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.28em;text-transform:uppercase;transition:background .2s}
.appraise:hover{background:#000}

.note{margin-top:18px;background:var(--card);border:1px solid var(--hair);border-left:2px solid var(--champagne);padding:14px 16px;font-family:var(--serif);font-style:italic;font-size:15.5px;line-height:1.55;color:var(--ink2)}

/* Membership */
.member{text-align:center;margin-top:4px}
.member-badge{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--champagne)}
.member-price{margin:12px 0 4px;font-family:var(--serif)}
.member-price b{font-weight:600;font-size:58px;color:var(--ink);line-height:1}
.member-price span{font-size:19px;color:var(--stone)}
.member-tag{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink2);margin-bottom:24px}
.perks{text-align:left;max-width:300px;margin:0 auto 24px}
.perk{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair)}
.perk:last-child{border-bottom:none}
.perk .tk{color:var(--green);font-size:15px;line-height:1.4;font-weight:600}
.perk .pt{font-family:var(--sans);font-weight:400;font-size:15px;color:var(--ink);line-height:1.4}
.ghost-link{display:block;width:100%;margin-top:14px;background:none;border:none;cursor:pointer;font-family:var(--sans);font-weight:400;font-size:12px;letter-spacing:.06em;color:var(--stone);text-decoration:underline;text-underline-offset:3px}
.ghost-link:hover{color:var(--ink)}
.member-note{margin-top:18px;background:var(--card);border:1px solid var(--hair);border-left:2px solid var(--green);padding:13px 15px;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink2);line-height:1.5}

.viewer{position:relative;width:100%;aspect-ratio:3/4;max-height:420px;background:var(--dark);border:1px solid var(--hair);border-radius:4px;overflow:hidden}
#reader{position:absolute;inset:0;width:100%;height:100%}
#reader video{width:100%!important;height:100%!important;object-fit:cover!important}
#reader img{display:none!important}
.frame{position:absolute;inset:16%;pointer-events:none;z-index:3}
.frame span{position:absolute;width:26px;height:26px;border:2px solid #f3ecda}
.frame .tl{top:0;left:0;border-right:none;border-bottom:none}
.frame .tr{top:0;right:0;border-left:none;border-bottom:none}
.frame .bl{bottom:0;left:0;border-right:none;border-top:none}
.frame .br{bottom:0;right:0;border-left:none;border-top:none}
.scanline{position:absolute;left:16%;right:16%;height:1px;background:var(--champagne);box-shadow:0 0 8px var(--champagne);animation:scan 2.4s ease-in-out infinite;z-index:3}
@keyframes scan{0%,100%{top:18%}50%{top:82%}}
.cam-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:2}
.cam-msg p{font-family:var(--serif);font-style:italic;font-size:16px;color:#c3b9a2;line-height:1.6}
.scan-hint{text-align:center;margin-top:14px;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--stone)}
.scan-actions{display:flex;gap:10px;margin-top:16px}
.scan-actions button{flex:1;cursor:pointer;border-radius:5px;padding:15px;font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.24em;text-transform:uppercase}
.btn-primary{background:var(--ink);color:var(--bg);border:none}
.btn-ghost{background:transparent;color:var(--stone);border:1.5px solid var(--hair)}
.btn-ghost:hover{border-color:var(--ink);color:var(--ink)}
.qmark{width:56px;height:56px;border-radius:50%;border:2px solid var(--amber);color:var(--amber);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:30px;margin:2px auto 16px}
.msg-note{font-family:var(--sans);font-weight:300;font-size:13.5px;line-height:1.6;color:var(--ink2);margin-top:12px}

.loading{margin-top:56px;text-align:center}
.loading .l1{font-family:var(--serif);font-style:italic;font-size:23px;color:var(--ink)}
.loading .l2{margin-top:10px;font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--stone);transition:opacity .3s}
.loading .dots{width:30px;height:2px;background:var(--champagne);margin:20px auto 0;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25;width:20px}50%{opacity:1;width:44px}}

.card{background:var(--card);color:var(--ink);border:1px solid var(--hair);border-radius:5px;padding:26px 26px 24px;box-shadow:0 20px 50px -34px #6b5f45}
.card-head{display:flex;justify-content:space-between;align-items:baseline}
.card-head .m{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.3em;text-indent:.3em}
.card-head .k{font-family:var(--sans);font-weight:500;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--stone)}
.hair{border:none;border-top:1px solid var(--hair);margin:18px 0}
.hair.tight{margin:14px 0}
.identity{text-align:center}
.prod-img{display:block;width:120px;height:120px;margin:2px auto 14px;object-fit:contain;background:#fff;border:1px solid var(--hair);border-radius:5px;padding:10px}
.pname{font-family:var(--serif);font-weight:600;font-size:29px;line-height:1.14;margin:2px 0 6px;color:var(--ink)}
.pcat{font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--stone)}

.verdict-panel{border-radius:7px;padding:18px 18px 16px;margin:4px 0 2px}
.verdict-block{display:flex;justify-content:space-between;align-items:center;gap:16px}
.verdict-block .vlabel{font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.vchip{display:inline-block;padding:9px 17px;border-radius:4px;color:#faf6ec;font-family:var(--serif);font-weight:600;font-size:23px;line-height:1}
.score{text-align:right;white-space:nowrap}
.score b{font-family:var(--serif);font-weight:600;font-size:46px;line-height:.9}
.score span{font-family:var(--serif);font-size:19px;color:var(--stone)}
.meter{height:7px;background:#00000014;margin:16px 0 2px;overflow:hidden;border-radius:4px}
.meter i{display:block;height:100%;border-radius:4px;transition:width .7s cubic-bezier(.2,.7,.2,1)}

.row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0}
.row .rk{font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--stone)}
.row .rv{font-family:var(--serif);font-weight:500;font-size:19px;color:var(--ink)}
.pverdict{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.5;color:var(--ink2);margin-top:8px}
.assess{font-family:var(--sans);font-weight:300;font-size:14.5px;line-height:1.65;color:var(--ink2)}
.pf{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.pf span{border:1px solid var(--hair);border-radius:3px;padding:5px 11px;font-family:var(--sans);font-weight:400;font-size:11px;letter-spacing:.04em;color:var(--ink2)}
.alt{padding:14px 0;border-top:1px solid var(--hair)}
.alt.first{border-top:none;padding-top:2px}
.alt-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.alt-name{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--ink);line-height:1.15}
.alt-price{font-family:var(--serif);font-weight:500;font-size:19px;white-space:nowrap}
.alt-meta{display:flex;align-items:center;gap:12px;margin:6px 0 5px}
.alt-tag{font-family:var(--sans);font-weight:500;font-size:9px;letter-spacing:.24em;text-transform:uppercase}
.alt-tag.equal{color:var(--stone)}
.alt-tag.superior{color:var(--green)}
.alt-saves{font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.12em;color:var(--ink2)}
.alt-why{font-family:var(--sans);font-weight:300;font-size:13px;line-height:1.5;color:var(--ink2)}
.src{margin-top:14px;font-family:var(--sans);font-weight:400;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone2);text-align:center}
.card-foot{text-align:center;font-family:var(--serif);font-weight:600;font-size:13px;letter-spacing:.34em;text-indent:.34em;color:var(--hair);padding-top:8px}
.again{width:100%;margin-top:16px;background:transparent;color:var(--stone);border:1.5px solid var(--hair);border-radius:5px;padding:15px;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.26em;text-transform:uppercase}
.again:hover{border-color:var(--ink);color:var(--ink)}
</style>
</head>
<body>
<div id="app"></div>
<input id="photoInput" type="file" accept="image/*" style="display:none" onchange="handlePhoto(this.files&&this.files[0]); this.value='';" />

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
/* ---- Veya ---- */

/* Paste your Stripe Payment Link between the quotes to take real £10/mo payments. */
var MEMBERSHIP_LINK = "";

var DB = [
  { keys:["nurofen","ibuprofen"], product:"Nurofen", category:"Painkiller \u00b7 Ibuprofen",
    worthScore:14, typicalPrice:"\u00a32.50 / 16",
    priceVerdict:"The very same medicine as the 40p box. You are paying for the name.",
    summary:"By law, own-brand ibuprofen carries the exact same active ingredient and dose as Nurofen. The tablet performs identically \u2014 the difference lives entirely in the packaging and the price.",

    alternatives:[
      {name:"Own-brand ibuprofen",price:"\u00a30.40",savings:"\u00a32.10",verdict:"same",why:"Identical active ingredient, dose and effect."},
      {name:"Value ibuprofen",price:"\u00a30.35",savings:"\u00a32.15",verdict:"same",why:"The same drug, for pennies."}
    ] },
  { keys:["evian","bottled water","water"], product:"Evian", category:"Bottled Water",
    worthScore:8, typicalPrice:"\u00a30.85 / 500ml",
    priceVerdict:"It is water. There is a tap at home.",
    summary:"Bottled water is among the largest mark-ups in any shop. Unless your tap water is genuinely poor, a refillable bottle performs the exact same service for close to nothing.",
    payingFor:["Convenience","The brand","The bottle"],
    alternatives:[
      {name:"Tap & refillable bottle",price:"~\u00a30",savings:"\u00a30.85 a go",verdict:"same",why:"The same water, no mark-up, no plastic."},
      {name:"Own-brand still water",price:"\u00a30.17",savings:"\u00a30.68",verdict:"same",why:"The same, cheaper, should you insist."}
    ] }
];

var productVal = "", priceVal = "";
var html5Qrcode = null, scanHandled = false, loadTimer = null;
var app = document.getElementById("app");

var OFF_DBS = [
  "https://world.openfoodfacts.org/api/v0/product/",
  "https://world.openbeautyfacts.org/api/v0/product/",
  "https://world.openproductsfacts.org/api/v0/product/"
];

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function stateFor(s){
  if(s>=70)return{label:"Worth it",color:"#2f8f57",tint:"#e7f2ea"};
  if(s>=45)return{label:"Premium tax",color:"#db8a2b",tint:"#f8eedd"};
  return{label:"Overpriced",color:"#cf463b",tint:"#f8e7e5"};
}
function lookupLocal(input){
  var q=(input||"").trim().toLowerCase(); if(!q)return null;
  for(var i=0;i<DB.length;i++){for(var j=0;j<DB[i].keys.length;j++){var k=DB[i].keys[j];if(q.indexOf(k)!==-1||k.indexOf(q)!==-1)return DB[i];}}
  return null;
}

var searchSVG='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2a2418" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><line x1="16.4" y1="16.4" x2="21" y2="21" stroke-linecap="round"/></svg>';
var instaSVG='<svg width="30" height="30" viewBox="0 0 32 32"><defs><radialGradient id="igg" cx="30%" cy="107%" r="150%"><stop offset="0%" stop-color="#fdf497"/><stop offset="8%" stop-color="#fdf497"/><stop offset="45%" stop-color="#fd5949"/><stop offset="62%" stop-color="#d6249f"/><stop offset="92%" stop-color="#285AEB"/></radialGradient></defs><rect x="1" y="1" width="30" height="30" rx="8" fill="url(#igg)"/><rect x="8.3" y="8.3" width="15.4" height="15.4" rx="5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="16" cy="16" r="4.1" fill="none" stroke="#fff" stroke-width="2"/><circle cx="22" cy="10" r="1.4" fill="#fff"/></svg>';
var tiktokSVG='<svg width="30" height="30" viewBox="0 0 32 32"><g><path d="M21 6c.7 2.9 2.6 4.8 5.5 5.1v3.6c-1.9.1-3.7-.5-5.2-1.5v6.7c0 3.9-3.2 7-7 7s-7-3.1-7-7 3.2-7 7-7c.4 0 .7 0 1 .1v3.8c-.3-.1-.6-.2-1-.2-1.8 0-3.2 1.4-3.2 3.2s1.4 3.2 3.2 3.2 3.2-1.4 3.2-3.2V6z" fill="#25F4EE" transform="translate(-1,-1)"/><path d="M21 6c.7 2.9 2.6 4.8 5.5 5.1v3.6c-1.9.1-3.7-.5-5.2-1.5v6.7c0 3.9-3.2 7-7 7s-7-3.1-7-7 3.2-7 7-7c.4 0 .7 0 1 .1v3.8c-.3-.1-.6-.2-1-.2-1.8 0-3.2 1.4-3.2 3.2s1.4 3.2 3.2 3.2 3.2-1.4 3.2-3.2V6z" fill="#FE2C55" transform="translate(1,1)"/><path d="M21 6c.7 2.9 2.6 4.8 5.5 5.1v3.6c-1.9.1-3.7-.5-5.2-1.5v6.7c0 3.9-3.2 7-7 7s-7-3.1-7-7 3.2-7 7-7c.4 0 .7 0 1 .1v3.8c-.3-.1-.6-.2-1-.2-1.8 0-3.2 1.4-3.2 3.2s1.4 3.2 3.2 3.2 3.2-1.4 3.2-3.2V6z" fill="#111111"/></g></svg>';
var mastHTML='<div class="mast"><div class="mark">VEYA</div><div class="rule"></div><div class="sub">Is it worth it?</div></div>';
var frameHTML='<div class="frame"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>';

function stopLoadingCycle(){ if(loadTimer){ clearInterval(loadTimer); loadTimer=null; } }
function showLoading(title){
  stopLoadingCycle();
  app.innerHTML=mastHTML+'<div class="loading"><div class="l1">'+esc(title)+'</div>'+
    '<div class="l2" id="loadmsg">Weighing value</div><div class="dots"></div></div>';
  window.scrollTo(0,0);
  var msgs=["Weighing value","Checking typical prices","Finding cheaper options","Comparing the field","Almost there"];
  var i=0;
  loadTimer=setInterval(function(){
    i=(i+1)%msgs.length;
    var el=document.getElementById("loadmsg");
    if(el){ el.style.opacity="0"; setTimeout(function(){ if(el){ el.textContent=msgs[i]; el.style.opacity="1"; } },200); }
  },1600);
}

function renderHome(note){
  stopLoadingCycle();
  var bars=[7,3,5,2,8,4,3,6,2,7,5,3,8,2,4,6,3,7],barsHTML="";
  for(var i=0;i<bars.length;i++){barsHTML+='<i style="height:'+(bars[i]*4)+'px"></i>';}
  app.innerHTML=
    '<button class="searchicon" onclick="go(\'membership\')" aria-label="Search">'+searchSVG+'</button>'+
    mastHTML+
    '<button class="scan-btn" onclick="go(\'scan\')"><div class="barcode">'+barsHTML+'</div><div class="t">Scan a barcode</div><div class="cap">Instant \u00b7 free</div></button>'+
    '<button class="snap-btn" onclick="triggerPhoto()">Snap or upload a photo</button>'+
    '<div class="snap-hint">No barcode? Photograph the product or pick one from your library.</div>'+
    (note?'<div class="note">'+esc(note)+'</div>':'')+
    '<div class="valueline">Know if it\u2019s worth it \u2014<br>before you buy.</div>'+
    '<div class="socials-label">Come say hi</div>'+
    '<div class="socials">'+
      '<a class="social" href="https://www.tiktok.com/@useveya" target="_blank" rel="noopener"><span class="slogo">'+tiktokSVG+'</span><span class="shandle">@useveya</span></a>'+
      '<a class="social" href="https://instagram.com/use.veya" target="_blank" rel="noopener"><span class="slogo">'+instaSVG+'</span><span class="shandle">@use.veya</span></a>'+
    '</div>';
}

/* ---- Membership gate ---- */

  var perks=["Search any product by name","Use Veya offline, anywhere","Unlimited appraisals, no waiting","Priority speed at busy times"];

      '<div class="member-badge">Veya Membership</div>'+

      '<div class="perks">'+perksHTML+'</div>'+

  else { renderMembership("Payments open very soon \u2014 you\u2019ll be first to know."); }

/* ---- Member search (typed) ---- */
function renderSearch(){
  stopLoadingCycle();
  app.innerHTML=mastHTML+
    '<label class="field-label">Appraise by name</label>'+
    '<input id="q" class="tin" placeholder="Any product in the world\u2026" value="'+esc(productVal)+'" oninput="productVal=this.value" onkeydown="if(event.key===\'Enter\')doSearch()" />'+
    '<div class="price-wrap"><label class="field-label">Price you\'d pay \u2014 optional</label><span class="cur">\u00a3</span>'+
    '<input id="p" class="tin" placeholder="0.00" inputmode="decimal" value="'+esc(priceVal)+'" oninput="priceVal=this.value" onkeydown="if(event.key===\'Enter\')doSearch()" /></div>'+
    '<button class="appraise" onclick="doSearch()">Appraise</button>'+
    '<button class="again" onclick="go(\'home\')">Back</button>';
  window.scrollTo(0,0);
}

/* ---- Engine ---- */
function callEngine(payload){
  return fetch("/api/appraise",{
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)
  }).then(function(res){
    return res.json().then(function(data){ if(!res.ok) throw new Error((data&&data.error)||"engine error"); return data; });
  });
}

/* ---- Photo ---- */
function triggerPhoto(){ var el=document.getElementById("photoInput"); if(el) el.click(); }
function handlePhoto(file){
  if(!file) return;
  showLoading("Reading the photo\u2026");
  var reader=new FileReader();
  reader.onerror=function(){ scanMessage("Couldn\u2019t read that","The photo didn\u2019t load. Try again."); };
  reader.onload=function(ev){
    var img=new Image();
    img.onerror=function(){ scanMessage("Couldn\u2019t read that","The photo didn\u2019t load. Try again."); };
    img.onload=function(){
      var max=1024,w=img.width,h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
      var canvas=document.createElement("canvas"); canvas.width=w; canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      var dataUrl,base64;
      try{ dataUrl=canvas.toDataURL("image/jpeg",0.75); base64=dataUrl.split(",")[1]; }
      catch(e){ scanMessage("Couldn\u2019t read that","That image didn\u2019t work. Try another."); return; }
      var payPrice=(priceVal&&priceVal.trim())?priceVal.trim():"";
      callEngine({ image:base64, mimeType:"image/jpeg", price:payPrice }).then(function(r){
        if(!r.alternatives||!r.alternatives.length){ scanMessage("Couldn\u2019t identify",(r.summary||"Veya couldn\u2019t make out the product. Try a clearer, closer photo.")); return; }
        if(payPrice) r.userPrice="\u00a3"+payPrice;
        r.source="live \u00b7 photo"; r.image=dataUrl;
        renderResult(r,"photo");
      }).catch(function(){ scanMessage("Veya is busy","The engine is under heavy load right now. Give it a moment and try again."); });
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---- Barcode camera ---- */
function renderScan(){
  stopLoadingCycle(); scanHandled=false;
  app.innerHTML=mastHTML+
    '<div class="viewer"><div id="reader"></div>'+frameHTML+'<div class="scanline"></div></div>'+
    '<div class="scan-hint">Point the camera at a barcode</div>'+
    '<div class="scan-actions"><button class="btn-ghost" onclick="cancelScan()">Cancel</button></div>';
  window.scrollTo(0,0); startScanner();
}
function startScanner(){
  if(typeof Html5Qrcode==="undefined"){ camMessage("The scanner couldn\u2019t load. Check your connection, then tap Try again.",true); return; }
  var ctorConfig={ verbose:false, experimentalFeatures:{ useBarCodeDetectorIfSupported:true } };
  if(typeof Html5QrcodeSupportedFormats!=="undefined"){
    ctorConfig.formatsToSupport=[
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39
    ];
  }
  try{ html5Qrcode=new Html5Qrcode("reader",ctorConfig); }
  catch(e){ camMessage("Couldn\u2019t start the camera. Tap Try again.",true); return; }
  html5Qrcode.start({ facingMode:"environment" },{ fps:20 },
    function(decodedText){ if(scanHandled)return; scanHandled=true; stopScanner(function(){ lookupBarcode(decodedText); }); },
    function(){}
  ).catch(function(){ camMessage("Veya needs camera access. Allow the camera when your browser asks, then tap Try again.",true); });
}
function camMessage(msg,showRetry){
  stopLoadingCycle();
  app.innerHTML=mastHTML+
    '<div class="viewer"><div class="cam-msg"><p>'+esc(msg)+'</p></div>'+frameHTML+'</div>'+
    '<div class="scan-actions">'+(showRetry?'<button class="btn-primary" onclick="renderScan()">Try again</button>':'')+
    '<button class="btn-ghost" onclick="go(\'home\')">Cancel</button></div>';
}
function stopScanner(cb){
  if(html5Qrcode){
    html5Qrcode.stop().then(function(){ try{html5Qrcode.clear();}catch(e){} html5Qrcode=null; if(cb)cb(); })
                       .catch(function(){ html5Qrcode=null; if(cb)cb(); });
  } else { if(cb)cb(); }
}
function cancelScan(){ stopScanner(function(){ go("home"); }); }
function scanMessage(title,msg){
  stopLoadingCycle();
  app.innerHTML=mastHTML+
    '<div class="card" style="text-align:center"><div class="qmark">?</div><div class="lbl">'+esc(title)+'</div>'+
    '<div class="msg-note">'+esc(msg)+'</div></div>'+
    '<div class="scan-actions"><button class="btn-primary" onclick="go(\'home\')">Home</button></div>';
  window.scrollTo(0,0);
}

/* ---- Barcode -> product (Food, Beauty, Products) -> verdict ---- */
function lookupBarcode(number){
  stopLoadingCycle();
  app.innerHTML=mastHTML+'<div class="loading"><div class="l1">Looking up product\u2026</div><div class="l2">Barcode '+esc(number)+'</div><div class="dots"></div></div>';
  window.scrollTo(0,0);
  tryDbs(number,0);
}
function tryDbs(number,idx){
  if(idx>=OFF_DBS.length){
    scanMessage("Not found","No match for that barcode in the free databases yet. For gadgets and other items, use \u201cSnap or upload a photo\u201d on the home screen.");
    return;
  }
  fetch(OFF_DBS[idx]+encodeURIComponent(number)+".json")
    .then(function(res){ return res.json(); })
    .then(function(data){
      if(data && data.status===1 && data.product){
        var p=data.product;
        var name=p.product_name||p.product_name_en||p.generic_name_en||p.generic_name||"";
        var brand=(p.brands||"").split(",")[0].trim();
        var image=p.image_front_url||p.image_url||p.image_front_small_url||"";
        var query=name||brand;
        if(!query){ tryDbs(number,idx+1); return; }
        if(brand && name && name.toLowerCase().indexOf(brand.toLowerCase())===-1) query=brand+" "+name;
        appraiseScanned(query, name||query, image);
      } else { tryDbs(number,idx+1); }
    })
    .catch(function(){ tryDbs(number,idx+1); });
}
function appraiseScanned(query, displayName, image){
  showLoading("Appraising \u2014 "+displayName);
  callEngine({ product:query, price:"" }).then(function(r){
    if(!r.alternatives||!r.alternatives.length){ scanMessage("Couldn\u2019t appraise",(r.summary||"Veya couldn\u2019t weigh this one up. Try another item.")); return; }
    r.source="live \u00b7 ai"; if(image) r.image=image;
    renderResult(r,"scan");
  }).catch(function(){ scanMessage("Veya is busy","The value engine is under heavy load right now. Give it a moment and scan again."); });
}

/* ---- Result ---- */
function renderLoading(){ showLoading("Appraising\u2026"); }
function renderResult(r, mode){
  stopLoadingCycle();
  var st=stateFor(r.worthScore);
  var html=mastHTML+'<div class="card" style="border-top:3px solid '+st.color+'">'+
    '<div class="card-head"><div class="m">VEYA</div><div class="k">Appraisal</div></div><hr class="hair" />'+
    '<div class="identity">'+
      (r.image?'<img class="prod-img" src="'+esc(r.image)+'" alt="" onerror="this.style.display=\'none\'" />':'')+
      '<div class="pname">'+esc(r.product)+'</div>'+(r.category?'<div class="pcat">'+esc(r.category)+'</div>':'')+
    '</div>'+
    '<hr class="hair" />'+
    '<div class="verdict-panel" style="background:'+st.tint+'">'+
      '<div class="verdict-block"><div><div class="vlabel">The verdict</div>'+
      '<div class="vchip" style="background:'+st.color+'">'+esc(st.label)+'</div></div>'+
      '<div class="score"><b style="color:'+st.color+'">'+r.worthScore+'</b><span> /100</span></div></div>'+
      '<div class="meter"><i style="width:'+Math.max(4,Math.min(100,r.worthScore))+'%;background:'+st.color+'"></i></div>'+
    '</div>'+
    '<hr class="hair tight" />'+
    '<div class="row"><span class="rk">Typical price</span><span class="rv">'+esc(r.typicalPrice)+'</span></div>'+
    (r.userPrice?'<div class="row"><span class="rk">You\'d pay</span><span class="rv">'+esc(r.userPrice)+'</span></div>':'')+
    (r.priceVerdict?'<div class="pverdict">'+esc(r.priceVerdict)+'</div>':'')+
    '<hr class="hair" /><div class="lbl" style="margin-bottom:10px">The assessment</div><div class="assess">'+esc(r.summary)+'</div>';
  if(r.payingFor&&r.payingFor.length){ html+='<div class="lbl" style="margin:20px 0 10px">What the price buys</div><div class="pf">'; for(var i=0;i<r.payingFor.length;i++)html+='<span>'+esc(r.payingFor[i])+'</span>'; html+='</div>'; }
  if(r.alternatives&&r.alternatives.length){
    html+='<hr class="hair" /><div class="lbl" style="margin-bottom:12px">Considered alternatives</div>';
    for(var a=0;a<r.alternatives.length;a++){var alt=r.alternatives[a];
      html+='<div class="alt'+(a===0?' first':'')+'"><div class="alt-top"><div class="alt-name">'+esc(alt.name)+'</div><div class="alt-price">'+esc(alt.price)+'</div></div>'+
        '<div class="alt-meta"><span class="alt-tag '+(alt.verdict==="better"?"superior":"equal")+'">'+(alt.verdict==="better"?"Superior":"Equal")+'</span>'+
        (alt.savings?'<span class="alt-saves">Saves '+esc(alt.savings)+'</span>':'')+'</div><div class="alt-why">'+esc(alt.why)+'</div></div>';
    }
  }
  var footer;
  if(mode==="scan") footer='<div class="scan-actions"><button class="btn-primary" onclick="renderScan()">Scan again</button><button class="btn-ghost" onclick="go(\'home\')">Home</button></div>';
  else if(mode==="photo") footer='<div class="scan-actions"><button class="btn-primary" onclick="triggerPhoto()">Snap again</button><button class="btn-ghost" onclick="go(\'home\')">Home</button></div>';
  else footer='<button class="again" onclick="go(\'search\')">Appraise another</button>';
  html+=(r.source?'<div class="src">'+esc(r.source)+'</div>':'')+'<hr class="hair" /><div class="card-foot">VEYA</div></div>'+footer;
  app.innerHTML=html; window.scrollTo(0,0);
}
function go(screen){
  stopLoadingCycle();
  if(screen==="home")renderHome();
  else if(screen==="scan")renderScan();
  else if(screen==="membership")renderMembership();
  else if(screen==="search")renderSearch();
  window.scrollTo(0,0);
}
function appraise(name){
  var q=(name||"").trim(); if(!q)return;
  renderLoading();
  var payPrice=(priceVal&&priceVal.trim())?priceVal.trim():"";
  callEngine({ product:q, price:payPrice }).then(function(r){
    if(!r.alternatives||!r.alternatives.length){ renderSearch(); return; }
    if(payPrice) r.userPrice="\u00a3"+payPrice;
    r.source="live \u00b7 ai";
    renderResult(r,"name");
  }).catch(function(){
    var local=lookupLocal(q);
    if(local){ var d={};for(var k in local)d[k]=local[k]; if(payPrice)d.userPrice="\u00a3"+payPrice; d.source="offline example"; renderResult(d,"name"); }
    else { renderSearch(); }
  });
}
function doSearch(){ appraise(productVal); }

renderHome();
</script>
